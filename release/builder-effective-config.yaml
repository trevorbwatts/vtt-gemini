directories:
  output: release
  buildResources: build
appId: com.trevorwatts.dmvtt
productName: Dungeon Master VTT
files:
  - filter:
      - dist/**/*
      - dist-electron/**/*
      - public/extras/**/*
      - public/sounds/**/*
      - package.json
win:
  target: nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Dungeon Master VTT
electronVersion: 31.7.7
